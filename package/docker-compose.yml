---
version: '3.8'
services:
  initialize:
    image: library/busybox:1.37.0-musl@sha256:5624bb6777cf469b1fb50ae3f981b15d2715ee2fffaf20b9998cfb7843726835
    platform: linux/amd64
    user: 1000:1000
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: 'no'
    entrypoint:
    - "/bin/sh"
    - "-ec"
    command:
    - |
      set -eu
      umask 077
      mkdir -p /tmp/private/data
      if [ ! -s /tmp/private/password ]; then
        temp=/tmp/private/password.$$$$
        od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > "$$temp"
        ln "$$temp" /tmp/private/password || test -s /tmp/private/password
        rm -f "$$temp"
      fi
      password=$$(cat /tmp/private/password)
      [ "$${#password}" = 64 ]
      printf 'authorization { user: "client", password: "%s" }\njetstream { store_dir: "/state/private/data" }\nport: 4222\n' "$$password" > /tmp/private/nats.conf.tmp
      mv /tmp/private/nats.conf.tmp /tmp/private/nats.conf
    volumes:
    - state:/tmp
    mem_limit: 32m
    pids_limit: 32
  nats:
    container_name: nats
    image: nats:2.15.2-scratch@sha256:6157c118e1f123b1d7ee3bc74906b2f52611d95fe1679e921f032a0fe38a129b
    platform: linux/amd64
    user: 1000:1000
    command:
    - "--config"
    - "/state/private/nats.conf"
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 96
    mem_limit: 192m
    ports:
    - 127.0.0.1:14222:4222
    volumes:
    - state:/state
    depends_on:
      initialize:
        condition: service_completed_successfully
volumes:
  state:
    driver: local
